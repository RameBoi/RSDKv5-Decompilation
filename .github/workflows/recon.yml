name: recon
on:
  push:
    branches: [ios]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
      - name: Get iOS 9.3 SDK and C++ headers
        run: |
          git clone --depth=1 https://github.com/theos/sdks
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc++-18-dev libc++abi-18-dev
      - name: Compile test program
        run: |
          cat > hello.cpp <<'EOF'
          #include <iostream>
          #include <string>
          #include <vector>
          int main() {
              std::vector<std::string> v = {"hello", "ios8"};
              for (auto &s : v) std::cout << s << std::endl;
              return 0;
          }
          EOF
          SDK=$PWD/sdks/iPhoneOS9.3.sdk
          clang++ --target=armv7-apple-ios8.0 -isysroot $SDK -nostdinc++ -isystem /usr/lib/llvm-18/include/c++/v1 -std=c++11 -c hello.cpp -o hello.o
          file hello.o
      - name: Try Theos linkers
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          TB=$THEOS/toolchain/linux/iphone/bin
          ls -l $TB | grep -i " ld"
          SDK=$PWD/sdks/iPhoneOS9.3.sdk
          for L in ld64.lld ld; do
            echo "=========== linker: $L"
            $TB/$L --version 2>&1 | head -3 || true
            clang++ --target=armv7-apple-ios8.0 -isysroot $SDK -nostdlib++ -fuse-ld=$TB/$L hello.o -lc++ -o hello_$L 2>&1 | head -20 || true
            file hello_$L 2>&1 | head -2 || true
          done
