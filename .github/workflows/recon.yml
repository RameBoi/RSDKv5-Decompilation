name: recon
on:
  push:
    branches: [ios]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Get iOS 9.3 SDK and C++ headers
        run: |
          git clone --depth=1 https://github.com/theos/sdks
          sudo apt-get update
          sudo apt-get install -y libc++-18-dev libc++abi-18-dev
          ls /usr/lib/llvm-18/include/c++/v1 | head -5
      - name: Compile test program
        run: |
          cat > hello.cpp <<'EOF'
          #include <iostream>
          #include <string>
          #include <vector>
          int main() {
              std::vector<std::string> v = {"hello", "ios8"};
              for (auto &s : v) std::cout << s << std::endl;
              return 0;
          }
          EOF
          SDK=$PWD/sdks/iPhoneOS9.3.sdk
          clang++ --target=armv7-apple-ios8.0 -isysroot $SDK -nostdinc++ -isystem /usr/lib/llvm-18/include/c++/v1 -std=c++11 -c hello.cpp -o hello.o
          file hello.o
      - name: Link test program
        run: |
          SDK=$PWD/sdks/iPhoneOS9.3.sdk
          clang++ --target=armv7-apple-ios8.0 -isysroot $SDK -nostdlib++ -fuse-ld=/usr/bin/ld64.lld-18 hello.o -lc++ -o hello
          file hello
      - name: Check minimum iOS version
        run: |
          /usr/lib/llvm-18/bin/llvm-objdump -p hello | grep -i -A4 "VERSION_MIN\|BUILD_VERSION" || true
