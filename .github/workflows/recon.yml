name: recon
on:
  push:
    branches: [ios]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Mania build file
        run: |
          echo "=== Game/CMakeLists.txt"; cat Game/CMakeLists.txt
      - name: Platform clues
        run: |
          echo "=== platform names"; grep -n "RETRO_PLATFORM\|TARGET_OS\|__APPLE__\|RETRO_iOS\|RETRO_OSX" RSDKv5/RSDK/Core/RetroEngine.hpp | head -60
          echo "=== xcode defines"; sed -n 1670,1700p RSDKv5.xcodeproj/project.pbxproj
          echo "=== SDL version"; grep -n "define SDL_MAJOR_VERSION\|define SDL_MINOR_VERSION\|define SDL_PATCHLEVEL" dependencies/ios/SDL/include/SDL_version.h
          echo "=== cocoaHelpers head"; head -40 RSDKv5/cocoaHelpers.mm
