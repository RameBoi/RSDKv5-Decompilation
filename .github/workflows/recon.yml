name: recon
on:
  push:
    branches: [ios]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Get iOS 9.3 SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks
          ls sdks/iPhoneOS9.3.sdk/usr/include/c++/v1 | head -5
          ls sdks/iPhoneOS9.3.sdk/usr/lib | grep -i "c++\|libSystem" | head
      - name: Compile tiny test program for armv7 iOS 8
        run: |
          cat > hello.cpp <<'EOF'
          #include <iostream>
          #include <string>
          #include <vector>
          int main() {
              std::vector<std::string> v = {"hello", "ios8"};
              for (auto &s : v) std::cout << s << std::endl;
              return 0;
          }
          EOF
          SDK=$PWD/sdks/iPhoneOS9.3.sdk
          clang++ --target=armv7-apple-ios8.0 -isysroot $SDK -stdlib=libc++ -std=c++11 -fuse-ld=/usr/bin/ld64.lld-18 hello.cpp -o hello
          file hello
      - name: Check minimum iOS version
        run: |
          ls /usr/lib/llvm-18/bin | grep -i "objdump" || true
          /usr/lib/llvm-18/bin/llvm-objdump -p hello | grep -i -A4 "VERSION_MIN\|BUILD_VERSION" || true
