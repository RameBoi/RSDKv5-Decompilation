name: recon
on:
  push:
    branches: [ios]
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build files
        run: |
          echo "=== CMakeLists.txt"; cat CMakeLists.txt
          echo "=== platforms/Linux.cmake"; cat platforms/Linux.cmake
      - name: iOS clues
        run: |
          echo "=== app glue files"; find . \( -path ./dependencies -o -path ./Game \) -prune -o \( -name "*.m" -o -name "*.mm" -o -name Info.plist \) -print | head -30
          echo "=== RETRO_IOS"; grep -rn "RETRO_IOS" RSDKv5 | head -60
          echo "=== render devices"; grep -n "RETRO_RENDERDEVICE" RSDKv5/RSDK/Core/RetroEngine.hpp | head -40
          echo "=== xcode settings"; grep -n "IPHONEOS_DEPLOYMENT_TARGET\|GCC_PREPROCESSOR_DEFINITIONS\|RETRO_\|ARCHS\|CLANG_CXX_LANGUAGE_STANDARD" RSDKv5.xcodeproj/project.pbxproj | head -60
