name: Build Sonic Mania iOS 8

on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  build-ios8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & Tools
        uses: Randomblock1/theos-action@v1

      - name: Get SDKs and Dependencies
        run: |
          git clone --depth=1 https://github.com/theos/sdks
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc++-18-dev libc++abi-18-dev cmake ninja-build dpkg zip

      - name: Create Compatibility Stubs & iOS Platform Config
        run: |
          mkdir -p stubs
          
          # Header stub for missing AvailabilityVersions.h in iOS 10.3 SDK
          cat > stubs/AvailabilityVersions.h <<'EOF'
          #ifndef _AVAILABILITY_VERSIONS_H_
          #define _AVAILABILITY_VERSIONS_H_
          #endif
          EOF

          # Objective-C category stub for iOS 11+ UIViewController methods missing in iOS 10.3 SDK
          cat > stubs/iOS11_Stubs.h <<'EOF'
          #ifndef IOS11_STUBS_H
          #define IOS11_STUBS_H
          #ifdef __OBJC__
          #import <UIKit/UIKit.h>
          @interface UIViewController (iOS11CompatStubs)
          - (void)setNeedsUpdateOfHomeIndicatorAutoHidden;
          - (void)setNeedsUpdateOfScreenEdgesDeferringSystemGestures;
          - (BOOL)prefersHomeIndicatorAutoHidden;
          - (NSUInteger)preferredScreenEdgesDeferringSystemGestures;
          @end
          #endif
          #endif
          EOF

          # C++ runtime stubs for missing libcpp abort symbol and integer division
          cat > stubs.cpp <<'EOF'
          extern "C" void abort(void);
          extern "C" int __divsi3(int a, int b) {
              int neg = 0;
              unsigned ua, ub;
              if (a < 0) { ua = -(unsigned)a; neg = !neg; } else { ua = (unsigned)a; }
              if (b < 0) { ub = -(unsigned)b; neg = !neg; } else { ub = (unsigned)b; }
              unsigned q = 0, r = 0;
              for (int i = 31; i >= 0; i--) {
                  r = (r << 1) | ((ua >> i) & 1);
                  if (r >= ub) { r -= ub; q |= (1u << i); }
              }
              return neg ? -(int)q : (int)q;
          }
          namespace std { inline namespace __1 {
              __attribute__((noreturn)) void __libcpp_verbose_abort(const char*, ...) { abort(); }
          } }
          EOF

          mkdir -p platforms
          cat > platforms/iOS.cmake <<'EOF'
          set(RETRO_SUBSYSTEM "SDL2" CACHE STRING "Subsystem" FORCE)

          # Add only SDL2 backend files to RETRO_FILES
          list(APPEND RETRO_FILES
              "RSDKv5/RSDK/Graphics/SDL2/SDL2RenderDevice.cpp"
              "RSDKv5/RSDK/Audio/SDL2/SDL2AudioDevice.cpp"
              "RSDKv5/RSDK/Input/SDL2/SDL2InputDevice.cpp"
              "RSDKv5/RSDK/User/Dummy/UserDummy.cpp"
              "${CMAKE_SOURCE_DIR}/stubs.cpp"
          )

          add_subdirectory(dependencies/ios/SDL EXCLUDE_FROM_ALL)

          find_library(UIKIT_LIB UIKit)
          find_library(FOUNDATION_LIB Foundation)
          find_library(OPENGLES_LIB OpenGLES)
          find_library(QUARTZ_LIB QuartzCore)
          find_library(AUDIOTB_LIB AudioToolbox)
          find_library(AVFOUNDATION_LIB AVFoundation)
          find_library(GAMECONTROLLER_LIB GameController)
          find_library(COREGRAPHICS_LIB CoreGraphics)

          include_directories(
              ${CMAKE_SOURCE_DIR}/dependencies/ios/SDL/include
              ${CMAKE_SOURCE_DIR}/dependencies/all
              ${CMAKE_SOURCE_DIR}/dependencies/all/tinyxml2
              ${CMAKE_SOURCE_DIR}/dependencies/all/iniparser
              ${CMAKE_SOURCE_DIR}/dependencies/all/stb_vorbis
              ${CMAKE_SOURCE_DIR}/dependencies/ios/ogg/include
              ${CMAKE_SOURCE_DIR}/dependencies/ios/vorbis/include
              ${CMAKE_SOURCE_DIR}/dependencies/ios/theora/include
          )

          link_libraries(
              SDL2-static
              ${UIKIT_LIB}
              ${FOUNDATION_LIB}
              ${OPENGLES_LIB}
              ${QUARTZ_LIB}
              ${AUDIOTB_LIB}
              ${AVFOUNDATION_LIB}
              ${GAMECONTROLLER_LIB}
              ${COREGRAPHICS_LIB}
          )
          EOF

      - name: Configure and Build Engine & Game
        run: |
          SDK=$PWD/sdks/iPhoneOS10.3.sdk
          STUBS=$PWD/stubs
          
          mkdir -p build && cd build
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDK \
            -DCMAKE_SYSROOT=$SDK \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_SYSTEM_PROCESSOR=armv7 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OBJC_COMPILER=clang \
            -DCMAKE_C_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -I$STUBS -fno-exceptions -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-deprecated-declarations -std=gnu99" \
            -DCMAKE_CXX_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -I$STUBS -I/usr/lib/llvm-18/include/c++/v1 -fno-exceptions -Wno-error -Wno-deprecated-declarations -std=c++11" \
            -DCMAKE_OBJC_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -I$STUBS -include $STUBS/iOS11_Stubs.h -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-deprecated-declarations -Wno-objc-method-access" \
            -DCMAKE_OBJCXX_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -I$STUBS -include $STUBS/iOS11_Stubs.h -I/usr/lib/llvm-18/include/c++/v1 -fno-exceptions -Wno-error -Wno-deprecated-declarations -Wno-objc-method-access" \
            -DCMAKE_EXE_LINKER_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -miphoneos-version-min=8.0 -lc++ -lc++abi -lgcc_s.1" \
            -DRETRO_USE_MOD_LOADER=OFF \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON

          make -j$(nproc)

      - name: Assemble App Bundle, IPA & DEB Packages
        run: |
          APP_DIR="build/RSDKv5U.app"
          mkdir -p "$APP_DIR"
          
          # Copy compiled binary into app bundle
          if [ -f "build/RetroEngine" ]; then
              cp build/RetroEngine "$APP_DIR/RSDKv5U"
          elif [ -f "build/RSDKv5U" ]; then
              cp build/RSDKv5U "$APP_DIR/RSDKv5U"
          fi
          chmod +x "$APP_DIR/RSDKv5U"

          # Generate iOS 8 Info.plist
          cat > "$APP_DIR/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>RSDKv5U</string>
              <key>CFBundleIdentifier</key>
              <string>com.rameboi.sonicmania</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>Sonic Mania</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>8.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # Package .ipa for sideloading
          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build && zip -r SonicMania_iOS8.ipa Payload && cd ..

          # Package .deb for jailbreak deployment
          mkdir -p deb_pkg/DEBIAN deb_pkg/Applications
          cp -r "$APP_DIR" deb_pkg/Applications/
          
          cat > deb_pkg/DEBIAN/control <<'EOF'
          Package: com.rameboi.sonicmania
          Name: Sonic Mania
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Sonic Mania (RSDKv5) engine port for iOS 8.4.1 (armv7)
          Maintainer: RameBoi
          Author: RameBoi
          Section: Games
          Depends: firmware (>= 8.0)
          EOF

          cat > deb_pkg/DEBIAN/postinst <<'EOF'
          #!/bin/sh
          chmod -R 755 /Applications/RSDKv5U.app
          uicache
          exit 0
          EOF

          chmod +x deb_pkg/DEBIAN/postinst
          dpkg-deb -b deb_pkg build/SonicMania_iOS8.deb

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicMania-iOS8-armv7
          path: |
            build/*.app
            build/*.ipa
            build/*.deb
