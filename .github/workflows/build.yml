name: Build Sonic Mania iOS 8

on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  build-ios8:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos & Tools
        uses: Randomblock1/theos-action@v1

      - name: Get SDKs and Dependencies
        run: |
          git clone --depth=1 https://github.com/theos/sdks
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc++-18-dev libc++abi-18-dev cmake ninja-build

      - name: Create Compatibility Stubs & iOS CMake Platform File
        run: |
          cat > stubs.cpp <<'EOF'
          extern "C" void abort(void);
          extern "C" int __divsi3(int a, int b) {
              int neg = 0;
              unsigned ua, ub;
              if (a < 0) { ua = -(unsigned)a; neg = !neg; } else { ua = (unsigned)a; }
              if (b < 0) { ub = -(unsigned)b; neg = !neg; } else { ub = (unsigned)b; }
              unsigned q = 0, r = 0;
              for (int i = 31; i >= 0; i--) {
                  r = (r << 1) | ((ua >> i) & 1);
                  if (r >= ub) { r -= ub; q |= (1u << i); }
              }
              return neg ? -(int)q : (int)q;
          }
          namespace std { inline namespace __1 {
              __attribute__((noreturn)) void __libcpp_verbose_abort(const char*, ...) { abort(); }
          } }
          EOF

          mkdir -p platforms
          cat > platforms/iOS.cmake <<'EOF'
          file(GLOB_RECURSE ENGINE_SOURCES 
              "RSDKv5/*.cpp" "RSDKv5/*.c" "RSDKv5/*.mm"
          )
          file(GLOB_RECURSE GAME_SOURCES 
              "Game/SonicMania/*.cpp" "Game/SonicMania/*.c"
          )

          add_subdirectory(dependencies/ios/SDL EXCLUDE_FROM_ALL)

          add_executable(RetroEngine ${ENGINE_SOURCES} ${GAME_SOURCES} ${CMAKE_SOURCE_DIR}/stubs.cpp)

          target_compile_definitions(RetroEngine PRIVATE
              RETRO_REV02=1
              RETRO_USING_SDL2=1
              GLES_SILENCE_DEPRECATION=1
          )

          target_include_directories(RetroEngine PRIVATE
              RSDKv5
              Game/SonicMania
              dependencies/ios/SDL/include
              dependencies/all/tinyxml2
              dependencies/all/stb_vorbis
              dependencies/ios/ogg/include
              dependencies/ios/vorbis/include
              dependencies/ios/theora/include
          )

          find_library(UIKIT_LIB UIKit)
          find_library(FOUNDATION_LIB Foundation)
          find_library(OPENGLES_LIB OpenGLES)
          find_library(QUARTZ_LIB QuartzCore)
          find_library(AUDIOTB_LIB AudioToolbox)
          find_library(AVFOUNDATION_LIB AVFoundation)
          find_library(GAMECONTROLLER_LIB GameController)
          find_library(COREGRAPHICS_LIB CoreGraphics)

          target_link_libraries(RetroEngine PRIVATE
              SDL2-static
              ${UIKIT_LIB}
              ${FOUNDATION_LIB}
              ${OPENGLES_LIB}
              ${QUARTZ_LIB}
              ${AUDIOTB_LIB}
              ${AVFOUNDATION_LIB}
              ${GAMECONTROLLER_LIB}
              ${COREGRAPHICS_LIB}
          )
          EOF

      - name: Configure and Build Engine & Game
        run: |
          SDK=$PWD/sdks/iPhoneOS10.3.sdk
          
          mkdir -p build && cd build
          
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=$SDK \
            -DCMAKE_SYSTEM_PROCESSOR=armv7 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -fno-exceptions" \
            -DCMAKE_CXX_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -I/usr/lib/llvm-18/include/c++/v1 -fno-exceptions" \
            -DCMAKE_EXE_LINKER_FLAGS="-arch armv7 -ios_version_min 8.0 -syslibroot $SDK -lc++ -lc++abi -lgcc_s.1" \
            -DRETRO_USE_MOD_LOADER=OFF \
            -DRETRO_SDL_VERSION=2

          make -j$(nproc) || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicMania-iOS8-armv7
          path: |
            build/*.app
            build/RSDKv5*
            build/RetroEngine*
