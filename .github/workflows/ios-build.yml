name: ios-build

on:
  push:
    branches: [ios]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      - name: Get SDKs and C++ headers
        run: |
          git clone --depth=1 https://github.com/theos/sdks
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc++-18-dev libc++abi-18-dev cmake ninja-build dpkg zip

      - name: Prepare RSDKv5 Submodule & Force OpenGL Window
        run: |
          rm -rf Game/dependencies/RSDKv5
          mkdir -p Game/dependencies/RSDKv5
          tar --exclude=./Game --exclude=./.git --exclude=./sdks --exclude=./theos -cf - . | tar -xf - -C Game/dependencies/RSDKv5

          # Link SDL2main for iOS UIWindow entry point
          sed -i 's/target_link_libraries(RetroEngine SDL2-static/target_link_libraries(RetroEngine SDL2main SDL2-static/' Game/dependencies/RSDKv5/platforms/iOS.cmake

          # Force OpenGL window creation instead of Metal
          R=Game/dependencies/RSDKv5/RSDKv5/RSDK/Graphics/SDL2/SDL2RenderDevice.cpp
          sed -i 's/int flags = SDL_WINDOW_METAL;/int flags = SDL_WINDOW_OPENGL;/' $R

          # Ensure main.cpp includes <SDL.h> for SDL_main macro resolution
          find Game/dependencies/RSDKv5 -name "main.cpp" -exec sed -i '1s/^/#include <SDL.h>\n/' {} +

      - name: Inject Analog Joystick & Player 1 Touch Engine
        run: |
          python3 - <<'PY'
          import re, os

          base = "Game/dependencies/RSDKv5/RSDKv5/RSDK/"

          def patch(path, pattern, make):
              s = open(path, newline="").read()
              new, n = re.subn(pattern, make, s, flags=re.M)
              if n != 1:
                  raise SystemExit("PATCH FAILED (%d matches) in %s for pattern %s" % (n, path, pattern))
              open(path, "w", newline="").write(new)

          # 1. Update Input.hpp with touch state declarations
          decl = """extern bool32 iosTouchLeft, iosTouchRight, iosTouchUp, iosTouchDown, iosTouchJump, iosTouchBack, iosTouchPause;
          extern float iosJoyKnobX, iosJoyKnobY;
          void IOSTouchUpdate();

          """
          patch(base + "Input/Input.hpp", r"^struct ControllerState \{", lambda m: decl + m.group(0))

          # 2. Update Input.cpp with dynamic analog stick and button mappings
          logic = """
          #include <math.h>

          namespace RSDK {
          bool32 iosTouchLeft  = false;
          bool32 iosTouchRight = false;
          bool32 iosTouchUp    = false;
          bool32 iosTouchDown  = false;
          bool32 iosTouchJump  = false;
          bool32 iosTouchBack  = false;
          bool32 iosTouchPause = false;

          float iosJoyKnobX = 0.18f;
          float iosJoyKnobY = 0.72f;

          static bool32 wasLeft  = false;
          static bool32 wasRight = false;
          static bool32 wasUp    = false;
          static bool32 wasDown  = false;
          static bool32 wasJump  = false;
          static bool32 wasBack  = false;
          static bool32 wasPause = false;

          static inline void ApplyTouchState(InputState &key, bool32 active, bool32 &wasActive) {
              if (active) {
                  key.down = true;
                  if (!wasActive) key.press = true;
                  wasActive = true;
              } else {
                  if (wasActive) {
                      key.down = false;
                      wasActive = false;
                  }
              }
          }

          void IOSTouchUpdate() {
              iosTouchLeft  = false;
              iosTouchRight = false;
              iosTouchUp    = false;
              iosTouchDown  = false;
              iosTouchJump  = false;
              iosTouchBack  = false;
              iosTouchPause = false;

              float joyCenterX = 0.18f;
              float joyCenterY = 0.72f;
              float joyRadius  = 0.14f;

              iosJoyKnobX = joyCenterX;
              iosJoyKnobY = joyCenterY;

              bool32 joyActive = false;

              for (int32 t = 0; t < touchInfo.count; ++t) {
                  if (!touchInfo.down[t]) continue;
                  float tx = touchInfo.x[t];
                  float ty = touchInfo.y[t];

                  // 1. Analog Joystick (Left Side)
                  float dx = tx - joyCenterX;
                  float dy = ty - joyCenterY;
                  float dist = sqrtf(dx * dx + dy * dy);

                  if (tx < 0.45f && ty > 0.35f && !joyActive) {
                      joyActive = true;
                      float clampDist = dist > joyRadius ? joyRadius : dist;
                      if (dist > 0.0001f) {
                          iosJoyKnobX = joyCenterX + (dx / dist) * clampDist;
                          iosJoyKnobY = joyCenterY + (dy / dist) * clampDist;
                      }
                      if (dx < -0.025f) iosTouchLeft  = true;
                      if (dx > 0.025f)  iosTouchRight = true;
                      if (dy < -0.025f) iosTouchUp    = true;
                      if (dy > 0.025f)  iosTouchDown  = true;
                  }

                  // 2. Jump / Confirm Button (Bottom Right - S Key Equivalent)
                  float jdx = tx - 0.84f;
                  float jdy = ty - 0.72f;
                  if (sqrtf(jdx * jdx + jdy * jdy) <= 0.15f) {
                      iosTouchJump = true;
                  }

                  // 3. Back / Cancel Button (Secondary - Esc Key Equivalent)
                  float bdx = tx - 0.72f;
                  float bdy = ty - 0.84f;
                  if (sqrtf(bdx * bdx + bdy * bdy) <= 0.09f) {
                      iosTouchBack = true;
                  }

                  // 4. Pause Button (Top Right - Enter Key Equivalent)
                  float pdx = tx - 0.92f;
                  float pdy = ty - 0.08f;
                  if (sqrtf(pdx * pdx + pdy * pdy) <= 0.10f) {
                      iosTouchPause = true;
                  }
              }

              // Apply strictly to Player 1 (controller[0])
              ApplyTouchState(controller[0].keyLeft,  iosTouchLeft,  wasLeft);
              ApplyTouchState(controller[0].keyRight, iosTouchRight, wasRight);
              ApplyTouchState(controller[0].keyUp,    iosTouchUp,    wasUp);
              ApplyTouchState(controller[0].keyDown,  iosTouchDown,  wasDown);

              // Jump maps to keyA, keyB, keyC for Jump / Spin Jump / Confirm
              ApplyTouchState(controller[0].keyA, iosTouchJump, wasJump);
              ApplyTouchState(controller[0].keyB, iosTouchBack, wasBack);
              ApplyTouchState(controller[0].keyC, iosTouchJump, wasJump);

              // Pause / Start maps to keyStart
              ApplyTouchState(controller[0].keyStart, iosTouchPause, wasPause);
          }
          }
          """
          patch(base + "Input/Input.cpp", r"^void RSDK::ProcessInput\(\)", lambda m: logic + m.group(0))
          patch(base + "Input/Input.cpp", r"^void RSDK::ProcessInput\(\)\r?\n\{", lambda m: m.group(0) + "\n    IOSTouchUpdate();")

          # 3. Render Modern Analog Stick Overlay in SDL2RenderDevice.cpp
          render_overlay = """
          namespace RSDK {
          extern bool32 iosTouchLeft, iosTouchRight, iosTouchUp, iosTouchDown, iosTouchJump, iosTouchBack, iosTouchPause;
          extern float iosJoyKnobX, iosJoyKnobY;
          }

          static void RenderIOSTouchOverlay(SDL_Renderer *renderer) {
              int outW = 0, outH = 0;
              SDL_GetRendererOutputSize(renderer, &outW, &outH);
              int W = outW, H = outH;
              if (W <= 0 || H <= 0) return;

              SDL_SetRenderDrawBlendMode(renderer, SDL_BLENDMODE_BLEND);

              auto DrawFillCircle = [&](int cx, int cy, int r, Uint8 red, Uint8 green, Uint8 blue, Uint8 alpha) {
                  SDL_SetRenderDrawColor(renderer, red, green, blue, alpha);
                  int r2 = r * r;
                  for (int dy = -r; dy <= r; dy++) {
                      int dy2 = dy * dy;
                      int dx = (int)sqrtf((float)(r2 - dy2));
                      SDL_RenderDrawLine(renderer, cx - dx, cy + dy, cx + dx, cy + dy);
                  }
              };

              auto DrawRing = [&](int cx, int cy, int r, int thickness, Uint8 red, Uint8 green, Uint8 blue, Uint8 alpha) {
                  SDL_SetRenderDrawColor(renderer, red, green, blue, alpha);
                  int outer2 = r * r;
                  int inner2 = (r - thickness) * (r - thickness);
                  for (int dy = -r; dy <= r; dy++) {
                      for (int dx = -r; dx <= r; dx++) {
                          int d2 = dx * dx + dy * dy;
                          if (d2 <= outer2 && d2 >= inner2) {
                              SDL_RenderDrawPoint(renderer, cx + dx, cy + dy);
                          }
                      }
                  }
              };

              // 1. Virtual Joystick Base Outer Ring
              int jcx = (int)(0.18f * W);
              int jcy = (int)(0.72f * H);
              int jr  = (int)(0.14f * H);
              DrawFillCircle(jcx, jcy, jr, 255, 255, 255, 30);
              DrawRing(jcx, jcy, jr, 3, 255, 255, 255, 140);

              // 2. Virtual Joystick Dynamic Thumb Knob
              int kx = (int)(RSDK::iosJoyKnobX * W);
              int ky = (int)(RSDK::iosJoyKnobY * H);
              int kr = (int)(0.06f * H);
              bool32 joyHeld = RSDK::iosTouchLeft || RSDK::iosTouchRight || RSDK::iosTouchUp || RSDK::iosTouchDown;
              DrawFillCircle(kx, ky, kr, 255, 255, 255, joyHeld ? 210 : 100);
              DrawRing(kx, ky, kr, 2, 255, 255, 255, 230);

              // 3. Jump Button (Bottom Right)
              int bcx = (int)(0.84f * W);
              int bcy = (int)(0.72f * H);
              int br  = (int)(0.095f * H);
              DrawFillCircle(bcx, bcy, br, 255, 255, 255, RSDK::iosTouchJump ? 200 : 75);
              DrawRing(bcx, bcy, br, 3, 255, 255, 255, 220);

              // 4. Back / Cancel Button (Secondary)
              int backcx = (int)(0.72f * W);
              int backcy = (int)(0.84f * H);
              int backr  = (int)(0.06f * H);
              DrawFillCircle(backcx, backcy, backr, 255, 255, 255, RSDK::iosTouchBack ? 200 : 60);
              DrawRing(backcx, backcy, backr, 2, 255, 255, 255, 180);

              // 5. Pause Button (Top Right)
              int pcx = (int)(0.92f * W);
              int pcy = (int)(0.08f * H);
              int pr  = (int)(0.05f * H);
              DrawFillCircle(pcx, pcy, pr, 255, 255, 255, RSDK::iosTouchPause ? 200 : 75);
              DrawRing(pcx, pcy, pr, 2, 255, 255, 255, 200);
          }
          """
          patch(base + "Graphics/SDL2/SDL2RenderDevice.cpp",
                r"^(\s*)SDL_RenderPresent\(renderer\);",
                lambda m: render_overlay + "\n    RenderIOSTouchOverlay(renderer);\n" + m.group(0))

          print("Analog Joystick and touch controls patched successfully!")
          PY

      - name: IOSBUILD configure
        run: |
          mkdir -p stubs
          printf '#ifndef AVAIL_VERSIONS_STUB_H\n#define AVAIL_VERSIONS_STUB_H\n#endif\n' > stubs/AvailabilityVersions.h
          cat > stubs/platver.c <<'EOF'
          typedef unsigned int u32;
          int __isPlatformVersionAtLeast(u32 platform, u32 major, u32 minor, u32 sub) { return major <= 8; }
          EOF
          LB=/usr/lib/llvm-18/bin
          SDK=$PWD/sdks/iPhoneOS10.3.sdk
          clang --target=armv7-apple-ios8.0 -isysroot $SDK -w -c stubs/platver.c -o stubs/platver.o
          CF="--target=armv7-apple-ios8.0 -isysroot $SDK -w -I$PWD/stubs -UGAME_INCLUDE_EDITOR -DRETRO_USING_GLES2=1 -DRETRO_USING_OPENGL=1 -DGLES_SILENCE_DEPRECATION=1 -Dmain=SDL_main"
          CXXF="-nostdinc++ -isystem /usr/lib/llvm-18/include/c++/v1 -fno-exceptions -fno-rtti"
          cmake -S Game -B build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$SDK -DCMAKE_SYSROOT=$SDK \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OBJC_COMPILER=clang -DCMAKE_OBJCXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_NAME_TOOL=/bin/true \
            -DCMAKE_AR=$LB/llvm-ar -DCMAKE_RANLIB=$LB/llvm-ranlib \
            -DCMAKE_NM=$LB/llvm-nm -DCMAKE_STRIP=$LB/llvm-strip -DCMAKE_OBJDUMP=$LB/llvm-objdump \
            -DCMAKE_C_FLAGS="$CF" -DCMAKE_CXX_FLAGS="$CF $CXXF" \
            -DCMAKE_OBJC_FLAGS="$CF" -DCMAKE_OBJCXX_FLAGS="$CF $CXXF" \
            -DCMAKE_EXE_LINKER_FLAGS="--target=armv7-apple-ios8.0 -isysroot $SDK -fuse-ld=$GITHUB_WORKSPACE/theos/toolchain/linux/iphone/bin/ld -nostdlib -lgcc_s.1 -lobjc $PWD/stubs/platver.o -Wl,-undefined,dynamic_lookup" \
            -DPLATFORM=iOS -DGAME_STATIC=ON -DRETRO_MOD_LOADER=OFF -DRETRO_USING_GLES2=ON -DRETRO_USING_OPENGL=ON -DWITH_RSDK=ON > configure.log 2>&1 || (tail -30 configure.log; exit 1)
          F=$(find build -path "*SDL2-static.dir/flags.make" | head -1)
          sed -i 's/-std=gnu++17//g' $F || true
          R=$(find build -path "*RetroEngine.dir/flags.make" | head -1)
          sed -i -E 's/-std=(gnu|c)\+\+(11|98|03)/-std=gnu++17/g' $R

      - name: IOSBUILD compile
        run: |
          cmake --build build -j4 -- -k > build.log 2>&1 || echo "BUILD FAILED"
          grep -E "error:" build.log | sed 's#/home/runner/work/RSDKv5-Decompilation/RSDKv5-Decompilation/##' | sort -u | head -15 | cut -c1-230 || true
          find build -type f -name RSDKv5U | head

      - name: IOSBUILD package
        run: |
          BIN=$(find build -type f -name RSDKv5U | head -1)
          if [ -z "$BIN" ]; then echo "no binary yet, skipping package"; exit 0; fi
          APP=out/Payload/RSDKv5U.app
          mkdir -p $APP
          cp "$BIN" $APP/RSDKv5U
          cp dependencies/ios/Default.png $APP/ 2>/dev/null || true
          cat > $APP/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleExecutable</key><string>RSDKv5U</string>
              <key>CFBundleIdentifier</key><string>com.rameboi.sonicmania</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>Sonic Mania</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>8.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>armv7</string><string>opengles-2</string></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
              <key>UIStatusBarHidden</key><true/>
              <key>UIRequiresFullScreen</key><true/>
          </dict>
          EOF
          $GITHUB_WORKSPACE/theos/toolchain/linux/iphone/bin/ldid -S $APP/RSDKv5U
          (cd out && zip -qr SonicMania_iOS8.ipa Payload)
          mkdir -p deb/Applications deb/DEBIAN
          cp -r $APP deb/Applications/
          cat > deb/DEBIAN/control <<'EOF'
          Package: com.rameboi.sonicmania
          Name: Sonic Mania
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Sonic Mania (RSDKv5) port for iOS 8 with Touch Controls
          Maintainer: RameBoi
          Section: Games
          Depends: firmware (>= 8.0)
          EOF
          printf '#!/bin/sh\nchmod -R 755 /Applications/RSDKv5U.app\nuicache\nexit 0\n' > deb/DEBIAN/postinst
          chmod 755 deb/DEBIAN/postinst
          dpkg-deb -b deb out/SonicMania_iOS8.deb
          ls -la out

      - name: Upload build files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SonicMania-iOS8
          path: out/*
          if-no-files-found: ignore
