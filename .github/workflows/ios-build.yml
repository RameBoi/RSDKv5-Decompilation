name: ios-build
on:
  push:
    branches: [ios]
env:
  MODS: "ON"
jobs:
  ios-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
      - name: Get SDKs and C++ headers
        run: |
          git clone --depth=1 https://github.com/theos/sdks
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc++-18-dev libc++abi-18-dev cmake
      - name: Put our RSDKv5 into the Mania game build
        run: |
          rm -rf Game/dependencies/RSDKv5
          mkdir -p Game/dependencies/RSDKv5
          tar --exclude=./Game --exclude=./.git --exclude=./sdks --exclude=./theos -cf - . | tar -xf - -C Game/dependencies/RSDKv5
          sed -i 's/target_link_libraries(RetroEngine SDL2-static/target_link_libraries(RetroEngine SDL2main SDL2-static/' Game/dependencies/RSDKv5/platforms/iOS.cmake
          sed -i 's/"-framework GameController"/"-Wl,-weak_framework,GameController"/' Game/dependencies/RSDKv5/platforms/iOS.cmake
          grep -n "weak_framework" Game/dependencies/RSDKv5/platforms/iOS.cmake
          R=Game/dependencies/RSDKv5/RSDKv5/RSDK/Graphics/SDL2/SDL2RenderDevice.cpp
          sed -i 's/int flags = SDL_WINDOW_METAL;/int flags = SDL_WINDOW_OPENGL;/' $R
      - name: Add touch controls
        run: python3 tools/touch_patch.py
      - name: Scale controls for small screens
        run: |
          python3 - <<'PY'
          base = "Game/dependencies/RSDKv5/RSDKv5/RSDK/"

          def sub(path, old, new):
              s = open(path, newline="").read()
              if s.count(old) != 1:
                  raise SystemExit("SCALE PATCH FAILED (%d matches) in %s for %r" % (s.count(old), path, old))
              open(path, "w", newline="").write(s.replace(old, new))

          sub(base + "Input/Input.hpp", "extern int32 iosScreenW, iosScreenH;", "extern int32 iosScreenW, iosScreenH;\nextern float iosUnit;")
          sub(base + "Input/Input.cpp", "int32 RSDK::iosScreenH   = 1536;", "int32 RSDK::iosScreenH   = 1536;\nfloat RSDK::iosUnit      = 1.0f;")
          sub(base + "Input/Input.cpp", "    float s = iosScale;", "    float s = iosScale * iosUnit;")
          sub(base + "Input/Input.cpp", "    float rSmall = 0.026f * H;", "    float rSmall = 0.026f * H * iosUnit;")
          sub(base + "Graphics/SDL2/SDL2RenderDevice.cpp", "        IOSComputeLayout();\n        static Uint32 fpsLast", """        {
                      static float dpi = 0.0f;
                      if (dpi == 0.0f) {
                          float dd = 0, hh = 0, vv = 0;
                          dpi = (SDL_GetDisplayDPI(0, &dd, &hh, &vv) == 0 && vv > 50.0f) ? vv : 264.0f;
                      }
                      float u = 5.8f / ((float)H / dpi);
                      iosUnit = u < 1.0f ? 1.0f : (u > 2.2f ? 2.2f : u);
                  }
                  IOSComputeLayout();
                  static Uint32 fpsLast""")
          print("scale patch ok")
          PY
      - name: Enable mod loader for iOS
        if: env.MODS == 'ON'
        run: |
          python3 tools/mod_patch.py
          printf '\nset_source_files_properties(RSDKv5/RSDK/Core/ModAPI.cpp PROPERTIES COMPILE_FLAGS "-fexceptions -frtti")\n' >> Game/dependencies/RSDKv5/platforms/iOS.cmake
          printf '#include <sstream>\ntemplate class std::basic_stringbuf<char>;\ntemplate class std::basic_istringstream<char>;\n' > Game/dependencies/RSDKv5/ios_cxx_stubs.cpp
          printf '\ntarget_sources(RetroEngine PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}/ios_cxx_stubs.cpp)\n' >> Game/dependencies/RSDKv5/platforms/iOS.cmake
      - name: IOSBUILD configure
        run: |
          mkdir -p stubs
          printf '#ifndef AVAIL_VERSIONS_STUB_H\n#define AVAIL_VERSIONS_STUB_H\n#endif\n' > stubs/AvailabilityVersions.h
          cat > stubs/platver.m <<'EOF'
          #import <UIKit/UIKit.h>
          #include <stdio.h>
          int __isPlatformVersionAtLeast(unsigned int platform, unsigned int major, unsigned int minor, unsigned int sub)
          {
              static int cur[3] = { -1, 0, 0 };
              if (cur[0] < 0) {
                  NSAutoreleasePool *pool = [[NSAutoreleasePool alloc] init];
                  const char *v = [[[UIDevice currentDevice] systemVersion] UTF8String];
                  int a = 0, b = 0, c = 0;
                  sscanf(v, "%d.%d.%d", &a, &b, &c);
                  cur[1] = b;
                  cur[2] = c;
                  cur[0] = a;
                  [pool release];
              }
              if (cur[0] != (int)major)
                  return cur[0] > (int)major;
              if (cur[1] != (int)minor)
                  return cur[1] > (int)minor;
              return cur[2] >= (int)sub;
          }
          EOF
          LB=/usr/lib/llvm-18/bin
          SDK=$PWD/sdks/iPhoneOS10.3.sdk
          T=armv7-apple-ios6.0
          clang --target=$T -isysroot $SDK -w -c stubs/platver.m -o stubs/platver.o
          CF="--target=$T -isysroot $SDK -w -I$PWD/stubs -UGAME_INCLUDE_EDITOR"
          CXXF="-nostdinc++ -isystem /usr/lib/llvm-18/include/c++/v1 -fno-exceptions -fno-rtti"
          cmake -S Game -B build \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=$SDK -DCMAKE_SYSROOT=$SDK \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_OBJC_COMPILER=clang -DCMAKE_OBJCXX_COMPILER=clang++ \
            -DCMAKE_INSTALL_NAME_TOOL=/bin/true \
            -DCMAKE_AR=$LB/llvm-ar -DCMAKE_RANLIB=$LB/llvm-ranlib \
            -DCMAKE_NM=$LB/llvm-nm -DCMAKE_STRIP=$LB/llvm-strip -DCMAKE_OBJDUMP=$LB/llvm-objdump \
            -DCMAKE_C_FLAGS="$CF" -DCMAKE_CXX_FLAGS="$CF $CXXF" \
            -DCMAKE_OBJC_FLAGS="$CF" -DCMAKE_OBJCXX_FLAGS="$CF $CXXF" \
            -DCMAKE_EXE_LINKER_FLAGS="--target=$T -isysroot $SDK -fuse-ld=$GITHUB_WORKSPACE/theos/toolchain/linux/iphone/bin/ld -nostdlib -lgcc_s.1 -lobjc $PWD/stubs/platver.o -Wl,-undefined,dynamic_lookup" \
            -DPLATFORM=iOS -DGAME_STATIC=ON -DRETRO_MOD_LOADER=$MODS -DWITH_RSDK=ON > configure.log 2>&1 || (tail -30 configure.log; exit 1)
          F=$(find build -path "*SDL2-static.dir/flags.make" | head -1)
          sed -i 's/-std=gnu++17//g' $F || true
          R=$(find build -path "*RetroEngine.dir/flags.make" | head -1)
          sed -i -E 's/-std=(gnu|c)\+\+(11|98|03)/-std=gnu++17/g' $R
      - name: IOSBUILD compile
        run: |
          cmake --build build -j4 -- -k > build.log 2>&1 || echo "BUILD FAILED"
          grep -E "error:" build.log | sed 's#/home/runner/work/RSDKv5-Decompilation/RSDKv5-Decompilation/##' | sort -u | head -20 | cut -c1-230 || true
          grep -E "Undefined symbols" -A12 build.log | head -30 | cut -c1-200 || true
          find build -type f -name RSDKv5U | head
      - name: IOSBUILD package
        run: |
          BIN=$(find build -type f -name RSDKv5U | head -1)
          if [ -z "$BIN" ]; then echo "no binary yet, skipping package"; exit 0; fi
          file "$BIN"
          APP=out/Payload/RSDKv5U.app
          mkdir -p $APP
          cp "$BIN" $APP/RSDKv5U
          cp dependencies/ios/Default.png $APP/ 2>/dev/null || true
          python3 - <<'PY'
          import zlib, struct
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          w, h = 640, 1136
          raw = b''.join(b'\x00' + b'\x00\x00\x00' * w for _ in range(h))
          data = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          open('out/Payload/RSDKv5U.app/Default-568h@2x.png', 'wb').write(data)
          PY
          cat > $APP/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key><string>en</string>
              <key>CFBundleExecutable</key><string>RSDKv5U</string>
              <key>CFBundleIdentifier</key><string>com.rameboi.sonicmania</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>CFBundleName</key><string>Sonic Mania</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0</string>
              <key>CFBundleVersion</key><string>10</string>
              <key>LSRequiresIPhoneOS</key><true/>
              <key>MinimumOSVersion</key><string>6.0</string>
              <key>UIDeviceFamily</key><array><integer>1</integer><integer>2</integer></array>
              <key>UIRequiredDeviceCapabilities</key><array><string>armv7</string></array>
              <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationLandscapeLeft</string><string>UIInterfaceOrientationLandscapeRight</string></array>
              <key>UIStatusBarHidden</key><true/>
          </dict>
          </plist>
          EOF
          $GITHUB_WORKSPACE/theos/toolchain/linux/iphone/bin/ldid -S $APP/RSDKv5U
          (cd out && zip -qr SonicMania_iOS8.ipa Payload)
          mkdir -p deb/Applications deb/DEBIAN
          cp -r $APP deb/Applications/
          cat > deb/DEBIAN/control <<'EOF'
          Package: com.rameboi.sonicmania
          Name: Sonic Mania
          Version: 1.0
          Architecture: iphoneos-arm
          Description: Sonic Mania (RSDKv5) port for 32-bit iOS 6 and up
          Maintainer: RameBoi
          Section: Games
          Depends: firmware (>= 6.0)
          EOF
          printf '#!/bin/sh\nchmod -R 755 /Applications/RSDKv5U.app\nuicache\nexit 0\n' > deb/DEBIAN/postinst
          chmod 755 deb/DEBIAN/postinst
          dpkg-deb -b deb out/SonicMania_iOS8.deb
          ls -la out
      - name: Upload build files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SonicMania-iOS8
          path: out/*
          if-no-files-found: ignore
