name: recon11
on:
  push:
    branches: [ios]
jobs:
  recon11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RECON12 fs shim and exceptions
        run: |
          M=RSDKv5/RSDK/Core/ModAPI.cpp
          H=RSDKv5/RSDK/Core/ModAPI.hpp
          echo "=== HPP 425-540"; sed -n 425,540p $H
          echo "=== CPP 1-45"; sed -n 1,45p $M
          echo "=== Link::Open definition"; grep -rn "Handle Open\|Link::Open\|namespace Link" RSDKv5 --include=*.hpp --include=*.cpp --include=*.mm | head -8
          echo "=== try block 1 (375-445)"; sed -n 375,445p $M
          echo "=== try block 2 (552-590)"; sed -n 552,590p $M
          echo "=== try blocks 3-5"; sed -n 878,892p $M; echo ---; sed -n 1112,1124p $M; echo ---; sed -n 1170,1182p $M
